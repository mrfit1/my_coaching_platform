name: Package project

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build project ZIP
        run: |
          zip -r my_coaching_platform-ready.zip . -x ".git/*" "node_modules/*" ".next/*" "my_coaching_platform-ready.zip"
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: my_coaching_platform-ready
          path: my_coaching_platform-ready.zip
          retention-days: 7
